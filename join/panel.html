<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>پنل اسم‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main{justify-content:flex-start;padding-top:2.5rem}
  h1.t{font-size:2rem;font-weight:900}
  .wide{width:min(100%,40rem)}
  .bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .bar input{flex:1;min-width:10rem}
  .bar button{padding:.8rem 1rem}
  .count{color:var(--mute);font-size:.95rem}
  .list{max-height:60vh;overflow:auto;border-radius:1rem}
  table{width:100%;border-collapse:collapse}
  td,th{padding:.7rem .8rem;text-align:right;border-bottom:1px solid rgba(255,255,255,.1)}
  th{color:var(--mute);font-weight:600;position:sticky;top:0;background:#101C47}
  td.d{color:var(--mute);font-size:.88rem;white-space:nowrap;direction:ltr;text-align:left}
  td.n{word-break:break-word}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true" style="display:none"></canvas>
<main>
  <h1 class="t">پنل اسم‌ها</h1>

  <section id="login" class="card">
    <form id="lf">
      <label for="pw" class="sr">رمز</label>
      <input id="pw" type="password" placeholder="رمز پنل" autocomplete="current-password" required>
      <p id="err" class="err" role="alert" hidden></p>
      <button type="submit">ورود</button>
    </form>
  </section>

  <section id="panel" class="card wide" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="جستجوی اسم...">
      <button id="reload" type="button">رفرش</button>
      <button id="csv" type="button">CSV</button>
    </div>
    <p class="count" id="count"></p>
    <div class="list"><table><thead><tr><th>اسم</th><th>زمان</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script>
(() => {
  const URL_ = "https://fjzhkprnxznijwmjrlka.supabase.co";
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqemhrcHJueHpuaWp3bWpybGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTQyOTksImV4cCI6MjEwMjc5MDI5OX0.5ruiJfuISuZ28NEMMSZ9XY3-UeKLOe99FLA2hT4wOEA";
  const $ = (i) => document.getElementById(i);
  let pass = "", data = [];

  async function load() {
    const r = await fetch(`${URL_}/rest/v1/rpc/get_join_names`, {
      method: "POST",
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ p: pass }),
    });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  }
  function render() {
    const q = $("q").value.trim().toLowerCase();
    const rows = data.filter((x) => x.name.toLowerCase().includes(q));
    $("count").textContent = `${rows.length} اسم از ${data.length}`;
    const tb = $("rows"); tb.textContent = "";
    for (const x of rows) {
      const tr = document.createElement("tr");
      const n = document.createElement("td"); n.className = "n"; n.textContent = x.name;
      const d = document.createElement("td"); d.className = "d";
      d.textContent = new Date(x.created_at).toLocaleString("fa-IR");
      d.style.direction = "rtl"; d.style.textAlign = "right";
      tr.append(n, d); tb.append(tr);
    }
  }
  $("lf").addEventListener("submit", async (e) => {
    e.preventDefault(); $("err").hidden = true; pass = $("pw").value;
    try { await load(); $("login").hidden = true; $("panel").hidden = false; }
    catch (_) { $("err").textContent = "رمز غلطه"; $("err").hidden = false; }
  });
  $("q").addEventListener("input", render);
  $("reload").addEventListener("click", () => load().catch(() => {}));
  $("csv").addEventListener("click", () => {
    const esc = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const out = "\ufeffname,created_at\n" + data.map((x) => esc(x.name) + "," + x.created_at).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/csv;charset=utf-8" }));
    a.download = "names.csv"; a.click();
  });
})();
</script>
</body>
</html>
