name: LEVEL UP APK

on:
  push:
    branches: [level-up-build]
    paths: ['LevelUp/**', '.github/workflows/level-up-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LevelUp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL_UP-debug-apk
          path: LevelUp/app/build/outputs/apk/debug/*.apk
