name: LEVEL UP APK

on:
  push:
    branches: [level-up-build]
    paths: ['LevelUp/**', '.github/workflows/level-up-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LevelUp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|Execution failed|not found|Caused by|FAILURE" -A3 build.log | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL_UP-debug-apk
          path: LevelUp/app/build/outputs/apk/debug/*.apk
