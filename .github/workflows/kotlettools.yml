name: Build KotletTools

on:
  push:
    paths:
      - "KotletTools/**"
      - ".github/workflows/kotlettools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KotletTools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotletTools
          path: KotletTools/target/KotletTools.jar
