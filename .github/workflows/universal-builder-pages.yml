name: Publish Universal ZIP Builder Console

on:
  push:
    branches:
      - main
    paths:
      - "UniversalZipBuilder/web/**"
      - ".github/workflows/universal-builder-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: universal-builder-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload console
        uses: actions/upload-pages-artifact@v3
        with:
          path: UniversalZipBuilder/web

      - name: Deploy console
        id: deployment
        uses: actions/deploy-pages@v4
