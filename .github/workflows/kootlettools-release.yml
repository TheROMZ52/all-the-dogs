name: Release KootletTools

on:
  push:
    tags:
      - "KootletTools-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KootletTools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build JAR
        run: mvn -B clean package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KootletTools ${{ github.ref_name }}
          generate_release_notes: true
          files: KootletTools/target/KootletTools.jar
          fail_on_unmatched_files: true
