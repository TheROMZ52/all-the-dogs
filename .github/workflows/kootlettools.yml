name: Build KootletTools

on:
  push:
    paths:
      - "KootletTools/**"
      - ".github/workflows/kootlettools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KootletTools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: KootletTools
          path: KootletTools/target/KootletTools.jar
