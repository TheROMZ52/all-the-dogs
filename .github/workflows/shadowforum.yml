name: ShadowForum build

on:
  push:
    branches: [feat/shadowforum]
    paths:
      - "ShadowForum/**"
      - ".github/workflows/shadowforum.yml"
  pull_request:
    paths:
      - "ShadowForum/**"
      - ".github/workflows/shadowforum.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShadowForum
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ShadowForum/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Commit dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/shadowforum'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(shadowforum): lock dependencies"
            git push
          fi
