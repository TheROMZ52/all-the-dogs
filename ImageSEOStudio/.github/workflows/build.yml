name: ImageSEOStudio build
on:
  push:
    paths:
      - "ImageSEOStudio/**"
  pull_request:
    paths:
      - "ImageSEOStudio/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImageSEOStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ImageSEOStudio/package-lock.json
      - run: npm install
      - run: npm run build
